name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    name: Check metadata and Apache licence default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94
        with:
          ruby-version: "3.3.12"
          bundler-cache: true
      - name: Test the metadata validator
        run: ruby test/validate_formalization_test.rb
      - name: Check the canonical template sentinel surface
        if: github.repository == 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb --expect-template
      - name: Reject retained template values in a derived repository
        if: github.repository != 'PalomarRegistry/PalomarTemplate'
        run: ruby scripts/validate-formalization.rb
      - name: Detect the repository licence
        run: |
          bundle exec licensee detect LICENSE --json --no-packages --no-readme > "$RUNNER_TEMP/license.json"
          ruby -rjson -e '
            report = JSON.parse(File.read(ARGV.fetch(0)))
            identifiers = report.fetch("licenses").map { |item| item.fetch("spdx_id") }
            abort "LICENSE is not detected exactly as Apache-2.0" unless identifiers == ["Apache-2.0"]
          ' "$RUNNER_TEMP/license.json"

  submission-link:
    name: Check where the README sends a submitter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the submission form the README names
        # Require the current destination as well as rejecting the retired one;
        # a missing or misspelt link would pass a negative-only check. Limit the
        # rejection to Palomar's form because other issue trackers are valid.
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          form = "https://submit.palomar-registry.org/"
          retired = re.compile(r"PalomarSubmission/issues/new")
          failed = False
          if form not in pathlib.Path("README.md").read_text():
              print(f"README.md: does not send a submitter to {form}")
              failed = True
          for document in sorted(pathlib.Path(".").rglob("*.md")):
              if ".lake" in document.parts:
                  continue
              for number, line in enumerate(document.read_text().splitlines(), 1):
                  if retired.search(line):
                      print(f"{document}:{number}: that submission form was deleted; submissions go to {form}")
                      failed = True
          raise SystemExit(failed)
          PY

  build-cone:
    name: Build with Lean (cone)
    runs-on: ubuntu-latest
    # The cone is every module outside the generated cell leaves. Measured 2026-11-25 from the
    # cancelled 6-hour run (job 138851813665): the 508 non-cell modules that finished cost
    # 6,079 CPU-seconds, while the 1,111 finished cell modules cost 79,029 -- the cells are the
    # cost, so they are the shards and this job is small.
    #
    # Serial on purpose. One module per lake invocation keeps exactly one kernel-certificate
    # elaboration in flight: the earlier parallel attempt was killed after 2h07m with "the hosted
    # runner lost communication with the server" because adjacent heavy modules swapped the
    # runner past its heartbeat. lake has no -j in this toolchain (it answers "unknown short option
    # '-j'"), so invocation granularity is the lever.
    timeout-minutes: 360
    steps:
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 48G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -m; df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          build: false
      - name: Build every module outside the generated cell leaves
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t MODULES < <(git ls-files 'Submission' | grep '\.lean$' | grep -v '^Submission/CatalanMeasure/GenD/Signed/Data/Cells/' | sed -e 's#\.lean$##' -e 's#/#.#g')
          echo "cone modules: ${#MODULES[@]}"
          for m in "${MODULES[@]}"; do
            lake build "$m"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cone-oleans
          path: .lake/build/lib/lean
          if-no-files-found: error
          retention-days: 7

  build-cell:
    name: Build with Lean (cells ${{ matrix.shard }} of 8)
    needs: build-cone
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 48G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -m; df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          build: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cone-oleans
          path: .lake/build/lib/lean
      - name: Build this shard's cells
        shell: bash
        run: |
          set -euo pipefail
          SHARDS=8
          SHARD=${{ matrix.shard }}
          mapfile -t CELLS < <(git ls-files 'Submission/CatalanMeasure/GenD/Signed/Data/Cells' | grep '\.lean$' | sed -e 's#\.lean$##' -e 's#/#.#g')
          sel=()
          for i in "${!CELLS[@]}"; do
            if (( i % SHARDS == SHARD )); then sel+=("${CELLS[$i]}"); fi
          done
          echo "shard ${SHARD}/${SHARDS}: ${#sel[@]} of ${#CELLS[@]} cell modules"
          for m in "${sel[@]}"; do
            lake build "$m"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cells-oleans-${{ matrix.shard }}
          path: .lake/build/lib/lean/Submission/CatalanMeasure/GenD/Signed/Data/Cells
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build with Lean
    # The submission cone needs about 12 h on a 4-vCPU runner, past GitHub's 6-hour job cap, so
    # it is built as a cone job plus eight cell shards. This job keeps the published check name
    # and passes only when every one of them passed.
    needs: [build-cone, build-cell]
    runs-on: ubuntu-latest
    steps:
      - run: echo "cone and all cell shards built"

  docs:
    name: Build API documentation
    # doc-gen4 needs the elaborated environment, and a fresh checkout has none: the 2026-11-25 run
    # spent its whole 6 hours building 2,116 Submission modules from scratch (zero Mathlib modules,
    # because the cache fetch works) before being cancelled. So this job waits for the cone and the
    # shards and restores their oleans instead of re-elaborating; docbuild requires the parent
    # package by path, so `lake build Submission:docs` from there reuses them.
    needs: [build-cone, build-cell]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 48G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -m; df -h / | tail -1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          build: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          # cone-oleans plus cells-oleans-0..7: the whole elaborated library, restored once.
          pattern: "*-oleans*"
          merge-multiple: true
          path: .lake/build/lib/lean
      - name: Build doc-gen4 output
        working-directory: docbuild
        env:
          MATHLIB_NO_CACHE_ON_UPDATE: "1"
          DISABLE_EQUATIONS: "1"
          DOCGEN_SRC: github
        shell: bash
        run: |
          set +e
          # The library in this workspace is `Submission` (root package `Verifier`). The template's
          # step name was `CatalanMeasure`, which no package or library in this repository
          # provides, so doc-gen4 target resolution failed with "unknown target" before any
          # documentation was built.
          lake build Submission:docs 2>&1 | tee "$RUNNER_TEMP/step.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the end of the log as an annotation, readable without the log archive.
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/step.log" | tail -c 3800 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tail of the failing step::$msg"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-documentation
          path: docbuild/.lake/build/doc
          if-no-files-found: error

  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Not a silent removal -- the job still runs and still reports its verdict.
    #
    # `scripts/verify-comparator.sh` refuses this repository's pinned toolchain outright:
    #
    #   error: toolchain leanprover/lean4:v4.34.1 does not bundle leanexport
    #   Palomar requires leanprover/lean4:v4.35.0-rc2 or later
    #
    # The submission is board-pinned by sha (588b7d6) at v4.34.1, and that pin is deliberately
    # kept: a forward toolchain bump would re-port judged content for no board benefit. The
    # board's own verifier runs this comparator at the pin, on its own runners. So the job's
    # failure does not fail the workflow until the pin moves.
    #
    # When `lean-toolchain` reaches >= v4.35.0-rc2, delete this line and the job becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements before builds
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          build: false
      - name: Make room for the kernel replay
        # The replay of OpenAI's vendored certificates through three kernels needs more
        # memory and disk than a standard runner has free; add swap and drop unused SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 24G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -m; df -h /
      - name: Install bubblewrap for lake comparator's sandbox
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
        # which `bwrap` needs for the sandbox; the runner is disposable.
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the toolchain's lake comparator
        shell: bash
        run: |
          set +e
          ./scripts/verify-comparator.sh 2>&1 | tee "$RUNNER_TEMP/step.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the end of the log as an annotation, readable without the log archive.
            msg=$(grep -v '^\s*$' "$RUNNER_TEMP/step.log" | tail -c 3800 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Tail of the failing step::$msg"
          fi
          exit "$status"
